# NAT 워크플로 설정 — MaintQ MCP(streamable-http) 연결 스키마 문서 (MQ-1901, D153).
#
# ⚠ 이 파일은 **스키마 문서화 목적**이다. 실행 검증(ⓘ·ⓘⓘ)은 이 파일을 `nat run` 으로
# 돌리지 않고 `spike/mcp_client_check.py`(nvidia-nat-mcp 의 `WorkflowBuilder.
# add_function_group()` 를 코드로 직접 호출)로 했다 — 이유: `nat run` 은 `workflow:`
# 최상위 항목에 **LLM 이 결정을 내리는 에이전트**(react_agent 등)가 필요한데 그 구성요소는
# `nvidia-nat-agents` 같은 별도 패키지에 있고(이 스파이크가 설치한 `nvidia-nat`+
# `nvidia-nat-mcp` 조합엔 없음), 순수 연결성 확인에는 불필요한 LLM 호출·추가 의존성을
# 끌어들인다. 아래 키 이름·구조는 `nat.plugins.mcp.client.client_config.
# MCPClientConfig`/`MCPServerConfig`(nvidia-nat-mcp==1.9.0) 소스에서 직접 확인한
# 값이다 — 추측 없음. MQ-1908(NAT 온보딩 워크플로 본 구현)이 실제 에이전트를 붙일 때
# 이 골격을 그대로 확장한다.
#
# 검증: `uv run nat validate --config_file spike/config_http.yml` (functions 섹션까지는
# 스키마 검증 가능 — `workflow:` 항목은 이 저장소에 설치된 패키지 범위에 없는 컴포넌트
# 타입이라 주석 처리해 두었다. 주석을 풀려면 `nvidia-nat-agents`(또는 동급 워크플로
# 컴포넌트 패키지)를 추가로 설치해야 한다).

# 최상위 키는 `functions:` 가 아니라 **`function_groups:`** 다 — `mcp_client` 는
# `register_function_group()`(단일 함수가 아니라 함수 그룹)으로 등록돼 있다
# (`nat/data_models/config.py:281` 실측 — 처음엔 `functions:` 로 썼다가
# `Input tag 'mcp_client' … does not match any of the expected tags` 로 실패해 정정).
function_groups:
  hv600_staging:
    _type: mcp_client
    server:
      transport: streamable-http
      # 실행 시 --override functions.hv600_staging.server.url ... 로 덮어써도 된다.
      url: "http://host.openshell.internal:8775/mcp"
      # custom_headers 는 streamable-http 전용 (stdio/sse 는 밸리데이터가 거부한다 —
      # client_config.py:74-87). Authorization 은 `auth_provider`(OAuth2 등)로 붙이는
      # 것이 정석이지만, MaintQ MCP 는 고정 bearer 1개라 custom_headers 로도 충분하다
      # (httpx 기본 헤더로 병합되어 매 요청에 실린다 — client_base.py:773-777 실측).
      custom_headers:
        Authorization: "Bearer ${MAINTQ_MCP_TOKEN}"
        X-User: "nat-onboarding"
    # `include` 가 있어야 이 그룹의 도구가 전역 함수 레지스트리에 편입돼
    # `hv600_staging__<tool>` 이름으로 다른 컴포넌트(워크플로 등)에서 참조 가능해진다
    # (`get_included_functions()` 실측 — MQ-1901 ⓘ 확인 과정에서 드러남).
    include:
      - lookup_error_code

