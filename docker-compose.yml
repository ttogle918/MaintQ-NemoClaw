services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: maintq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintq
    ports:
      - "5434:5432"
    volumes:
      - maintq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maintq_postgres_data:
