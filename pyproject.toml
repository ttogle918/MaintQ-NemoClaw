[project]
name = "maintq"
version = "0.1.0"
description = "설비 진단부터 부품 발주까지 — B2B 제조 보전 AI 에이전트 (Q 시리즈 3번째)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.118.0",
    "fastapi>=0.139.2",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    # M1 데이터 파이프라인 (SP1 EDA·extract_error_codes.py에서 사용)
    "openai>=3.3.1",
    "pdfplumber>=0.11",
    # 단일 페이지 PDF 분할 (data/external/elice_docvision.py, D105). pdfplumber 의
    # 전이 의존성으로 이미 설치돼 있었으나 직접 선언으로 승격 — pdfplumber 가 의존성을
    # 바꾸면 조용히 깨지는 것을 막는다.
    "pypdfium2>=5.9.0",
    # 결재 문서 docx 생성 (D124). 순수 pip — pandoc 같은 시스템 바이너리를 늘리지 않는다.
    "python-docx>=1.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.51.0",
    # Postgres
    "psycopg[binary,pool]>=3.1.0",  # psycopg 3.x with binary & connection pooling
    "asyncpg>=0.28.0",              # Async Postgres driver (optional)
    # Vectors (for pgvector)
    "pgvector>=0.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]
# data-analysis/ 노트북 전용 (EDA·전처리). 런타임 서버는 이걸 쓰지 않는다 —
# 백엔드/MCP 에 pandas 의존을 들이지 않으려고 별도 그룹으로 뺐다.
#   실행: uv run --group analysis jupyter lab
analysis = [
    "pandas>=2.2",
    "pyarrow>=17",      # parquet 저장
    "openpyxl>=3.1",    # 조달청 xlsx 읽기
    "jupyter>=1.1",
    "nbstripout>=0.7",  # 커밋 전 출력 제거
]

[tool.ruff]
line-length = 100
target-version = "py311"
